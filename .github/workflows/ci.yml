name: CI

on:
  push:
    branches: [main, 'feature/**']
  pull_request:
    branches: [main]

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
      - run: dotnet restore SwiftRide.slnx
      - run: dotnet build SwiftRide.slnx --no-restore --configuration Release
      - run: dotnet test SwiftRide.slnx --no-build --configuration Release --collect:"XPlat Code Coverage" --results-directory ./test-results
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: test-results
          path: test-results

  docker-e2e:
    needs: build-and-test
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Tạo .env từ file mẫu
        run: cp .env.example .env
      - name: Kiểm tra cú pháp compose
        run: docker compose config -q
      - name: Build và khởi động toàn bộ hệ thống
        run: docker compose up -d --build --wait --wait-timeout 300
      - name: Smoke test (đặt xe -> thanh toán -> Paid)
        run: bash scripts/smoke.sh
      - name: In log khi lỗi
        if: failure()
        run: docker compose logs --no-color --tail=200
      - name: Dọn dẹp
        if: always()
        run: docker compose down -v